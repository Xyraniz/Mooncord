[package]
name = "mooncord-native"
version = "0.1.0"
edition = "2024"
description = "A separate native Rust client for private Discord conversations"
license = "GPL-3.0-or-later"
repository = "https://github.com/Xyraniz/Mooncord"
default-run = "mooncord-native"

[dependencies]
async-trait = "0.1.89"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
dirs = "6"
futures-util = "0.3"
keyring = "3.6"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "gzip", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1", features = ["v4"] }
wry = "0.57"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[lints.rust]
unsafe_code = "deny"
